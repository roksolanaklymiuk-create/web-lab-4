<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Галерея Клим`юк Роксолани</h1>

    <h2>Мої зображення</h2>
    
    <div class="gallery-grid">
        <div class="gallery-item">
            <h2 class="title-smaller">Зображення у цій папці</h2>
            <img src="photo.jpg" alt="Моє фото">
        </div>

        <div class="gallery-item">
            <h2 class="title-larger">Зображення у папці</h2>
            <img src="images/photo.jpg" alt="Фото з папки">
        </div>

        <div class="gallery-item">
            <div class="large-container">
                <h2>Зображення онлайн</h2>
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Carpathian_National_University.jpg/800px-Carpathian_National_University.jpg" alt="ПНУ">
            </div>
        </div>
    </div>

</html>
